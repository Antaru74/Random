      - name: Compile with Android NDK
        run: |
          set -e
          NDK="${ANDROID_NDK_HOME}"
          TCBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TCBIN/aarch64-linux-android24-clang"
          CXX="$TCBIN/aarch64-linux-android24-clang++"
          STRIP="$TCBIN/llvm-strip"
          [ -x "$CC" ]  || { echo "FAIL: $CC tidak ada"; ls "$TCBIN" | head; exit 1; }
          [ -x "$CXX" ] || { echo "FAIL: $CXX tidak ada"; exit 1; }
          [ -x "$STRIP" ] || { echo "FAIL: $STRIP tidak ada"; exit 1; }

          INC_MOD="-Isrc -Isrc/third_party"
          EXTRA="-include sys/types.h"

          mkdir -p build/mod

          echo "== compile module .c =="
          for f in device_rules hw_rules; do
            "$CC" -std=c11 -O2 -fPIC -fvisibility=hidden -Wno-everything $EXTRA $INC_MOD -c "src/$f.c" -o "build/mod/$f.o"
          done

          echo "== compile module .cpp =="
          for f in build_spoof hw_hooks zygisk_module companion; do
            "$CXX" -std=c++17 -O2 -fPIC -fvisibility=hidden -fno-exceptions -fno-rtti -Wno-everything $EXTRA $INC_MOD -c "src/$f.cpp" -o "build/mod/$f.o"
          done

          echo "== link =="
          "$CXX" -shared -Wl,--gc-sections -Wl,--exclude-libs,ALL \
            -llog -o build/libzygisk.so build/mod/*.o

          echo "--- pre-strip readelf ---"
          readelf -d build/libzygisk.so | grep -E 'NEEDED|RPATH|RUNPATH' || true

          echo "== sanity: tidak boleh ada symbol shadowhook =="
          if nm -D build/libzygisk.so 2>/dev/null | grep -qi shadowhook; then
            echo "FAIL: symbol shadowhook ditemukan"
            exit 1
          fi
          echo "OK: tidak ada shadowhook"

          echo "== sanity: tidak boleh ada RPATH/RUNPATH =="
          if readelf -d build/libzygisk.so 2>/dev/null | grep -qE 'RPATH|RUNPATH'; then
            echo "WARN: RPATH terdeteksi, mencoba strip"
            patchelf --remove-rpath build/libzygisk.so || true
          fi

          echo "== sanity: entry point harus ada =="
          nm -D build/libzygisk.so | grep -E 'zygisk_(module|companion)_entry' || { echo "FAIL: entry hilang"; exit 1; }

          echo "== strip =="
          cp build/libzygisk.so build/libzygisk.so.bak
          "$STRIP" --strip-all build/libzygisk.so
          ls -la build/libzygisk.so.bak build/libzygisk.so

          echo "--- post-strip readelf ---"
          readelf -d build/libzygisk.so | grep -E 'NEEDED|RPATH|RUNPATH' || true
          echo "--- post-strip symbols ---"
          nm -D build/libzygisk.so | grep -E 'zygisk_(module|companion)_entry'

      - name: Write module files
        run: |
          set -e
          cat > module/module.prop <<'X_EOF'
          id=appspoof_zygisk
          name=AppSpoof
          version=v1.0.0-gh
          versionCode=1
          author=APPSPOOF
          description=Per-app device & CPU/GPU spoofing. Zygisk + WebUI. Kill-switch /data/adb/appspoof/DISABLE.
          X_EOF

          cat > module/customize.sh <<'X_EOF'
          #!/system/bin/sh
          SKIPUNZIP=0
          ui_print "- APPSPOOF: customize"
          set_perm_recursive "$MODPATH" 0 0 0755 0644
          [ -d "$MODPATH/bin" ] && set_perm_recursive "$MODPATH/bin" 0 0 0755 0755
          [ -d "$MODPATH/webroot" ] && set_perm_recursive "$MODPATH/webroot" 0 0 0755 0644
          [ -d "$MODPATH/zygisk" ] && set_perm_recursive "$MODPATH/zygisk" 0 0 0755 0644
          CFG=/data/adb/appspoof
          mkdir -p "$CFG"; chmod 0700 "$CFG" 2>/dev/null
          [ -f "$CFG/device.conf" ] || : > "$CFG/device.conf"
