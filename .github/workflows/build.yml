          [ -f "$CFG/hw_enabled" ]     || printf '1\n' > "$CFG/hw_enabled"
          chmod 0600 "$CFG"/* 2>/dev/null
          ui_print "- APPSPOOF: done"
          X_EOF

          cat > module/uninstall.sh <<'X_EOF'
          #!/system/bin/sh
          set -u
          CFG=/data/adb/appspoof
          case "$CFG" in /data/adb/appspoof) : ;; *) exit 1 ;; esac
          [ -d "$CFG" ] && rm -rf "${CFG:?}"
          [ -f /data/local/tmp/appspoof.log ] && rm -f /data/local/tmp/appspoof.log
          exit 0
          X_EOF

          cat > module/bin/appspoofctl.sh <<'X_EOF'
          #!/system/bin/sh
          set -eu
          CFG=/data/adb/appspoof
          DC=$CFG/device.conf; HC=$CFG/hw.conf
          DE=$CFG/device_enabled; HE=$CFG/hw_enabled
          DIS=$CFG/DISABLE; LOG=/data/local/tmp/appspoof.log
          LOCK=$CFG/.lock
          init(){ mkdir -p "$CFG"; [ -f "$DC" ]||:>"$DC"; [ -f "$HC" ]||:>"$HC"
                  [ -f "$DE" ]||printf '1\n'>"$DE"; [ -f "$HE" ]||printf '1\n'>"$HE"
                  chmod 0600 "$DC" "$HC" "$DE" "$HE" 2>/dev/null||true; }
          log(){ printf '[%s] [%s] %s\n' "$(date -u +%FT%TZ)" "$1" "$2" >> "$LOG" 2>/dev/null||true
                chmod 0644 "$LOG" 2>/dev/null||true; }
          locka(){ i=0; while ! mkdir "$LOCK" 2>/dev/null; do i=$((i+1)); [ $i -ge 20 ]&&exit 1; sleep 1; done; }
          lockr(){ rmdir "$LOCK" 2>/dev/null||true; }
          force_stop(){ [ -n "${1:-}" ] && am force-stop "$1" >/dev/null 2>&1||true; log GLOBAL "force-stop $1"; }
          dlist(){ awk -F'\t' '!/^#/ && NF>0 {print}' "$DC" 2>/dev/null||true; }
          dset(){ p=$1; c=$2; locka
            tmp="$DC.tmp.$$"
            awk -F'\t' -v p="$p" -v c="$c" 'BEGIN{f=0}/^#/{print;next}NF==0{next}{if($1==p){print p"\t"c;f=1}else print}END{if(!f)print p"\t"c}' "$DC">"$tmp"
            mv "$tmp" "$DC"; lockr; force_stop "$p"; log DEVICE "set $p=$c"; }
          drm(){ p=$1; locka
            tmp="$DC.tmp.$$"; awk -F'\t' -v p="$p" '!/^#/ && NF>0 && $1==p{next}{print}' "$DC">"$tmp"
            mv "$tmp" "$DC"; lockr; force_stop "$p"; log DEVICE "remove $p"; }
          dcl(){ pk=$(awk -F'\t' '!/^#/&&NF>0{print $1}' "$DC"); :>"$DC"; for p in $pk; do force_stop "$p"; done; log DEVICE clear; }
          hlist(){ awk -F'\t' '!/^#/ && NF>0 {print}' "$HC" 2>/dev/null||true; }
          hset(){ p=$1; g=$2; c=$3; locka
            tmp="$HC.tmp.$$"
            awk -F'\t' -v p="$p" -v g="$g" -v c="$c" 'BEGIN{f=0}/^#/{print;next}NF==0{next}{if($1==p){print p"\t"g"\t"c;f=1}else print}END{if(!f)print p"\t"g"\t"c}' "$HC">"$tmp"
            mv "$tmp" "$HC"; lockr; force_stop "$p"; log HW "set $p $g $c"; }
          hrm(){ p=$1; locka
            tmp="$HC.tmp.$$"; awk -F'\t' -v p="$p" '!/^#/ && NF>0 && $1==p{next}{print}' "$HC">"$tmp"
            mv "$tmp" "$HC"; lockr; force_stop "$p"; log HW "remove $p"; }
          hcl(){ pk=$(awk -F'\t' '!/^#/&&NF>0{print $1}' "$HC"); :>"$HC"; for p in $pk; do force_stop "$p"; done; log HW clear; }
          stat(){ echo "device_enabled=$(cat "$DE" 2>/dev/null||echo ?)"
                  echo "hw_enabled=$(cat "$HE" 2>/dev/null||echo ?)"
                  [ -f "$DIS" ] && echo "kill-switch=AKTIF" || echo "kill-switch=off"
                  echo "device_rules=$(awk -F'\t' '!/^#/&&NF>0' "$DC"|wc -l)"
                  echo "hw_rules=$(awk -F'\t' '!/^#/&&NF>0' "$HC"|wc -l)"; }
          init
          cmd="${1:-}"; shift 2>/dev/null||true
          case "$cmd" in
            device) s="${1:-}"; shift||true
              case "$s" in
                list) dlist ;;
                set) dset "${1:?}" "${2:?}" ;;
                remove) drm "${1:?}" ;;
                clear) dcl ;;
                enable) printf '1\n'>"$DE"; log DEVICE enable ;;
                disable) printf '0\n'>"$DE"; log DEVICE disable ;;
                status) cat "$DE" ;;
              esac ;;
            hw) s="${1:-}"; shift||true
              case "$s" in
                list) hlist ;;
                set) hset "${1:?}" "${2:-}" "${3:-}" ;;
                remove) hrm "${1:?}" ;;
                clear) hcl ;;
                enable) printf '1\n'>"$HE"; log HW enable ;;
                disable) printf '0\n'>"$HE"; log HW disable ;;
                status) cat "$HE" ;;
              esac ;;
            log) t="${1:-all}"; n="${2:-50}"
              case "$t" in
                device) grep -F '[DEVICE]' "$LOG" 2>/dev/null|tail -n "$n"||true ;;
                hw) grep -F '[HW]' "$LOG" 2>/dev/null|tail -n "$n"||true ;;
                *) tail -n "$n" "$LOG" 2>/dev/null||true ;;
              esac ;;
            disable-all) :>"$DIS"; echo "DISABLE"; log GLOBAL disable-all ;;
            enable-all) rm -f "$DIS"; echo "enabled"; log GLOBAL enable-all ;;
            status) stat ;;
            *) echo "usage: appspoofctl {device|hw|log|disable-all|enable-all|status} ..." ;;
          esac
          X_EOF

