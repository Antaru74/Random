          cat > module/webroot/app.js <<'X_EOF'
          'use strict';
          (function(){
            var KS = window.ksu || window.Ksu || null;
            var CTL = '/data/adb/modules/appspoof_zygisk/bin/appspoofctl.sh';

            function $(id){ return document.getElementById(id); }
            function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
            function toast(m,e){
              var t=$('toast'); if(!t) return;
              t.textContent=String(m).slice(0,220);
              t.classList.remove('hidden'); t.classList.toggle('err', !!e);
              clearTimeout(toast._t);
              toast._t=setTimeout(function(){ t.classList.add('hidden'); },3500);
            }

            var _exec = [];
            function _rec(cmd, tag, outLen, errLen){
              _exec.push(tag + ' | ' + cmd.slice(0,90) + ' | outLen=' + outLen + ' | errLen=' + errLen);
              if (_exec.length > 40) _exec.shift();
            }

            function b64decode(s){
              try {
                var bin = atob(String(s).replace(/\s+/g,''));
                try { return decodeURIComponent(escape(bin)); } catch(e2) { return bin; }
              } catch(e) { return ''; }
            }

            function execB64(cmd){
              if (!KS || typeof KS.exec !== 'function') { _rec(cmd, 'noksu', 0, 0); return ''; }
              var full = cmd + " 2>&1 | base64 -w 0";
              var r;
              try { r = KS.exec(full); }
              catch(e) { _rec(cmd, 'throw', 0, 0); return ''; }
              if (r == null) { _rec(cmd, 'null', 0, 0); return ''; }
              if (typeof r === 'string') {
                _rec(cmd, 'str-b64', r.length, 0);
                return b64decode(r);
              }
              if (typeof r === 'object' && typeof r.then === 'function') {
                _rec(cmd, 'promise-ignored', 0, 0);
                return '';
              }
              if (typeof r === 'object' && r.stdout != null) {
                _rec(cmd, 'obj-b64', String(r.stdout).length, String(r.stderr||'').length);
                return b64decode(r.stdout);
              }
              _rec(cmd, 'unknown', 0, 0);
              return '';
            }

            function shq(s){ return "'" + String(s).replace(/'/g, "'\\''") + "'"; }

            function ctl(args){
              var cmd = 'sh ' + CTL + ' ' + args;
              var out = execB64(cmd);
              if (!out) out = execB64('su -c ' + shq(cmd));
              return out || '';
            }

            function listPackages(){
              var out = execB64('pm list packages -3');
              if (!out) out = execB64('su -c ' + shq('pm list packages -3'));
              if (!out) out = execB64('su -c ' + shq('cmd package list packages'));
              return out || '';
            }

            var PR = window.APPSPOOF_PRESETS||{}, GP = window.APPSPOOF_GPU||{}, CP = window.APPSPOOF_CPU||{};
            var st = { device:{enabled:true, rules:[]}, hw:{enabled:true, rules:[]}, apps:null };

            function parseApps(t){
              var l=(t||'').split(/\r?\n/), o=[];
              for (var i=0;i<l.length;i++){
                var s=l[i].trim();
                if(!s) continue;
                if(s.indexOf('package:')===0) s=s.slice(8);
                if(s && o.indexOf(s)<0) o.push(s);
              }
              o.sort(); return o;
            }

            function loadApps(){
              if (st.apps) return st.apps;
              st.apps = parseApps(listPackages());
              return st.apps;
            }

            function stat(){
              var out = ctl('status');
              var kv = {};
              (out||'').split(/\r?\n/).forEach(function(l){
                var m = l.match(/^([a-z\-_]+)=(.*)$/); if (m) kv[m[1]] = m[2];
              });
              st.device.enabled = kv.device_enabled === '1';
              st.hw.enabled = kv.hw_enabled === '1';
              if($('device-enabled')) $('device-enabled').checked = st.device.enabled;
              if($('hw-enabled')) $('hw-enabled').checked = st.hw.enabled;
              var ksel = $('stat-ks');
              if (ksel){
                var k = kv['kill-switch'] || '';
                ksel.textContent = k.indexOf('AKTIF')>=0 ? 'ks ON' : 'ks off';
                ksel.className = 'pill ' + (k.indexOf('AKTIF')>=0 ? 'danger' : 'ok');
              }
              var de = $('stat-device');
              if (de){ de.textContent = 'device ' + (kv.device_rules||'0'); de.className = 'pill ' + (st.device.enabled?'ok':''); }
              var he = $('stat-hw');
              if (he){ he.textContent = 'hw ' + (kv.hw_rules||'0'); he.className = 'pill ' + (st.hw.enabled?'ok':''); }
            }

            function loadD(){
              var out = ctl('device list');
              var o=[];
              (out||'').split(/\r?\n/).forEach(function(l){
                if(!l || l.charAt(0)==='#') return;
                var p=l.split('\t');
                if(p.length>=2 && p[0]) o.push({pkg:p[0], code:p[1]||''});
              });
              st.device.rules = o;
              renderD();
              if($('device-count')) $('device-count').textContent = o.length + ' apps Spoofed';
            }

            function loadH(){
              var out = ctl('hw list');
              var o=[];
              (out||'').split(/\r?\n/).forEach(function(l){
                if(!l || l.charAt(0)==='#') return;
                var p=l.split('\t');
                if(p.length>=1 && p[0]) o.push({pkg:p[0], gpu:p[1]||'', cpu:p[2]||''});
              });
              st.hw.rules = o;
              renderH();
              if($('hw-count')) $('hw-count').textContent = o.length + ' configured';
            }

            function lbl(c){ return (PR[c] && PR[c].label) || c || '?'; }

            function renderD(){
              var b=$('device-list'); if(!b) return;
              b.innerHTML='';
              if(!st.device.rules.length){ b.innerHTML='<div class="muted">Belum ada.</div>'; return; }
              st.device.rules.forEach(function(r){
                var d=document.createElement('div'); d.className='item';
                d.innerHTML =
                  '<div class="line1"><div class="pkg">'+esc(r.pkg)+'</div><div class="tag">'+esc(lbl(r.code))+'</div></div>'+
                  '<div class="line2"><div class="sub">code: '+esc(r.code)+'</div>'+
                  '<button class="btn secondary" data-a="ed" data-p="'+esc(r.pkg)+'">Edit</button>'+
                  '<button class="btn danger" data-a="dd" data-p="'+esc(r.pkg)+'">Hapus</button></div>';
                b.appendChild(d);
              });
            }

            function renderH(){
              var b=$('hw-list'); if(!b) return;
              b.innerHTML='';
              if(!st.hw.rules.length){ b.innerHTML='<div class="muted">Belum ada.</div>'; return; }
              st.hw.rules.forEach(function(r){
                var g = r.gpu ? (GP[r.gpu]||r.gpu) : 'None';
                var c = r.cpu ? (CP[r.cpu]||r.cpu) : 'None';
                var d=document.createElement('div'); d.className='item';
                d.innerHTML =
                  '<div class="line1"><div class="pkg">'+esc(r.pkg)+'</div><div class="tag">'+esc(g)+'</div></div>'+
                  '<div class="line2"><div class="sub">CPU: '+esc(c)+'</div>'+
                  '<button class="btn secondary" data-a="eh" data-p="'+esc(r.pkg)+'">Edit</button>'+
                  '<button class="btn danger" data-a="dh" data-p="'+esc(r.pkg)+'">Hapus</button></div>';
                b.appendChild(d);
              });
            }

            function fill(){
              var s=$('device-code');
              if(s){
                s.innerHTML='';
                Object.keys(PR).sort(function(a,b){return lbl(a).localeCompare(lbl(b))}).forEach(function(k){
                  var o=document.createElement('option'); o.value=k; o.textContent=lbl(k); s.appendChild(o);
                });
              }
              var g=$('hw-gpu');
              if(g){
                g.innerHTML='<option value="">None</option>';
                Object.keys(GP).sort().forEach(function(k){
                  var o=document.createElement('option'); o.value=k; o.textContent=GP[k]; g.appendChild(o);
                });
              }
              var c=$('hw-cpu');
              if(c){
                c.innerHTML='<option value="">None</option>';
                Object.keys(CP).sort().forEach(function(k){
                  var o=document.createElement('option'); o.value=k; o.textContent=CP[k]; c.appendChild(o);
                });
              }
            }

            function pick(box, apps, q, cb){
              var f = q ? apps.filter(function(p){return p.toLowerCase().indexOf(q)>=0}) : apps;
              f = f.slice(0,200);
              box.innerHTML='';
              if(!f.length) box.innerHTML='<div class="app">Tidak ada ('+apps.length+').</div>';
              else f.forEach(function(p){
                var d=document.createElement('div'); d.className='app'; d.textContent=p;
                d.onclick=function(){ cb(p); box.classList.add('hidden'); };
                box.appendChild(d);
              });
              box.classList.remove('hidden');
            }

            function onSD(){
              var q=($('device-pkg').value||'').trim().toLowerCase();
              var a = loadApps();
              pick($('device-applist'), a, q, function(p){ $('device-pkg').value=p; });
              if(!a.length) toast('Tidak ada app ('+a.length+'). Cek log.', true);
            }
            function onSH(){
              var q=($('hw-pkg').value||'').trim().toLowerCase();
              var a = loadApps();
              pick($('hw-applist'), a, q, function(p){ $('hw-pkg').value=p; });
            }

            function onDA(){
              var p=($('device-pkg').value||'').trim();
              var c=$('device-code').value;
              if(!p||!c){ toast('Isi pkg & preset', true); return; }
              ctl('device set '+p+' '+c);
              loadD();
              stat();
              toast('Set ' + p + ' -> ' + lbl(c));
            }
            function onHA(){
              var p=($('hw-pkg').value||'').trim();
              var g=$('hw-gpu').value;
              var c=$('hw-cpu').value;
              if(!p){ toast('Isi pkg', true); return; }
              if(!g&&!c){ toast('Pilih GPU/CPU', true); return; }
              ctl("hw set "+p+" '"+g+"' '"+c+"'");
              loadH();
              stat();
              toast('Set ' + p);
            }

            function onDC(){ if(!confirm('Clear device?'))return; ctl('device clear'); loadD(); stat(); }
            function onHC(){ if(!confirm('Clear HW?'))return; ctl('hw clear'); loadH(); stat(); }
            function onDT(v){ ctl(v?'device enable':'device disable'); stat(); }
            function onHT(v){ ctl(v?'hw enable':'hw disable'); stat(); }

            function showDebug(){
              var body = $('log-body'); if(!body) return;
              var lines = ['=== EXEC TRACE ('+_exec.length+') ==='].concat(_exec);
              lines.push('');
              lines.push('=== ksu ===');
              lines.push('KS ada: ' + (!!KS));
              lines.push('KS.exec.length: ' + (KS && KS.exec ? KS.exec.length : 'n/a'));
              lines.push('typeof KS.exec: ' + (KS && KS.exec ? typeof KS.exec : 'n/a'));
              lines.push('');
              lines.push('=== raw: ctl status (decoded) ===');
              var out1 = ctl('status');
              lines.push(JSON.stringify(out1));
              lines.push('');
              lines.push('=== raw: pm list packages -3 (decoded, first 300 char) ===');
              var out2 = listPackages();
              lines.push(JSON.stringify((out2||'').slice(0,300)));
              lines.push('');
              lines.push('=== jumlah app: ' + parseApps(out2).length + ' ===');
              body.textContent = lines.join('\n');
            }

            function onApply(){
              loadD(); loadH(); stat();
              toast('Apply OK');
            }

            function tabs(){
              document.querySelectorAll('.tab').forEach(function(t){
                t.onclick=function(){
                  var n=t.getAttribute('data-tab');
                  document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('active', x===t); });
                  document.querySelectorAll('.panel').forEach(function(p){ p.classList.toggle('active', p.id==='tab-'+n); });
                  if(n==='log') showDebug();
                };
              });
            }

            function bind(){
              var x;
              if(x=$('device-enabled')) x.onchange=function(e){ onDT(e.target.checked); };
              if(x=$('hw-enabled')) x.onchange=function(e){ onHT(e.target.checked); };
              if(x=$('device-search')) x.onclick=onSD;
              if(x=$('device-add')) x.onclick=onDA;
              if(x=$('device-clear')) x.onclick=onDC;
              if(x=$('hw-search')) x.onclick=onSH;
              if(x=$('hw-add')) x.onclick=onHA;
              if(x=$('hw-clear')) x.onclick=onHC;
              if(x=$('log-refresh')) x.onclick=showDebug;
              if(x=$('apply')) x.onclick=onApply;
              if(x=$('reload')) x.onclick=function(){ location.reload(); };
              document.addEventListener('click', function(e){
                var t=e.target;
                if(!t || t.tagName!=='BUTTON') return;
                var a=t.getAttribute('data-a'), p=t.getAttribute('data-p');
                if(!a||!p) return;
                if(a==='ed'){
                  var r=st.device.rules.filter(function(x){return x.pkg===p})[0];
                  if(r){ $('device-pkg').value=r.pkg; var s=$('device-code');
                    for(var i=0;i<s.options.length;i++) if(s.options[i].value===r.code){ s.selectedIndex=i; break; } }
                  window.scrollTo({top:0, behavior:'smooth'});
                } else if(a==='dd'){
                  if(!confirm('Hapus '+p+'?')) return;
                  ctl('device remove '+p); loadD(); stat();
                } else if(a==='eh'){
                  var r2=st.hw.rules.filter(function(x){return x.pkg===p})[0];
                  if(r2){ $('hw-pkg').value=r2.pkg; $('hw-gpu').value=r2.gpu||''; $('hw-cpu').value=r2.cpu||''; }
                  window.scrollTo({top:0, behavior:'smooth'});
                } else if(a==='dh'){
                  if(!confirm('Hapus '+p+'?')) return;
                  ctl('hw remove '+p); loadH(); stat();
                }
              });
            }

            function boot(){
              tabs(); bind(); fill();
              if(!KS) toast('ksu tidak terdeteksi', true);
              loadD(); loadH(); stat();
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
            else boot();
          })();
          X_EOF

          chmod +x module/customize.sh module/uninstall.sh module/bin/appspoofctl.sh

      - name: Package module zip
        run: |
          set -e
          STAGE=build/stage
          rm -rf "$STAGE"; mkdir -p "$STAGE/zygisk" "$STAGE/bin" "$STAGE/webroot"
          cp module/module.prop  "$STAGE/"
          cp module/customize.sh "$STAGE/"
          cp module/uninstall.sh "$STAGE/"
          cp module/bin/appspoofctl.sh "$STAGE/bin/"
          cp src/presets.tsv "$STAGE/bin/presets.tsv"
          cp src/hw_models.tsv "$STAGE/bin/hw_models.tsv"
          cp module/webroot/index.html "$STAGE/webroot/"
          cp module/webroot/style.css  "$STAGE/webroot/"
          cp module/webroot/app.js     "$STAGE/webroot/"
          cp module/webroot/presets.js "$STAGE/webroot/"
          cp build/libzygisk.so "$STAGE/zygisk/arm64-v8a.so"
          chmod 0755 "$STAGE/bin/appspoofctl.sh" "$STAGE/customize.sh" "$STAGE/uninstall.sh"
          chmod 0644 "$STAGE/zygisk/arm64-v8a.so"
          echo "=== struktur ==="
          find "$STAGE" -type f | sort
          echo ""
          echo "=== .so info ==="
          readelf -d "$STAGE/zygisk/arm64-v8a.so" | grep -E 'NEEDED|RPATH|RUNPATH' || true
          nm -D "$STAGE/zygisk/arm64-v8a.so" | grep -E 'zygisk_(module|companion)_entry'
          echo ""
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          ZIP="appspoof-module-$STAMP.zip"
          ( cd "$STAGE" && zip -r -q "../../$ZIP" . -x '.*' )
          ls -la "$ZIP"
          sha256sum "$ZIP"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appspoof-module
          path: appspoof-module-*.zip
          if-no-files-found: error
