name: Build AppSpoof
on:
  workflow_dispatch:
    inputs:
      zygisk_api:
        description: 'Zygisk API version (4 atau 5)'
        required: false
        default: '5'
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          add-to-path: true

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 zip patchelf
          python3 --version
          echo "NDK=$ANDROID_NDK_HOME"

      - name: Fetch external deps
        run: |
          set -e
          mkdir -p src/third_party src/hw_templates docs/ref module/bin module/webroot

          curl -fsSL -o src/third_party/zygisk.hpp \
            "https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp"

          FW=54dcd6491b9f1c8612ae037ce94a0c6b22348bf4
          BASE="https://raw.githubusercontent.com/ronardnx/penguin_frameworks_base/$FW/core/java/com/android/internal/util/custom"
          curl -fsSL -o docs/ref/PerAppsPropsUtils.java     "$BASE/PerAppsPropsUtils.java"
          curl -fsSL -o docs/ref/AdvancedAppSpoofUtils.java "$BASE/AdvancedAppSpoofUtils.java"
          SET="https://raw.githubusercontent.com/Project-PenguinOS/packages_apps_Settings/41697be08ff1bf2760f6a7ec318db61e9adbe9bb"
          curl -fsSL -o docs/ref/custom_arrays.xml "$SET/res/values/custom_arrays.xml"
          curl -fsSL -o docs/ref/HW_SPOOF.kt \
            "https://raw.githubusercontent.com/Project-PenguinOS/packages_apps_Settings/5fe1711e707754b57dd66b69d987864b10c4ac6d/src/com/android/settings/system/spoofing/AdvancedAppSpoofSettings.kt"

          echo "deps OK"
          ls -la src/third_party docs/ref

      - name: Write source files (C + headers)
        run: |
          set -e

          cat > src/rules_common.h <<'X_EOF'
          #ifndef APPSPOOF_RULES_COMMON_H
          #define APPSPOOF_RULES_COMMON_H
          #include <stdio.h>
          static inline int appspoof_flag_read(const char *path) {
              FILE *f = fopen(path, "r");
              if (!f) return 0;
              int c = fgetc(f);
              fclose(f);
              return c == '1' ? 1 : 0;
          }
          #endif
          X_EOF

          cat > src/device_rules.h <<'X_EOF'
          #ifndef APPSPOOF_DEVICE_RULES_H
          #define APPSPOOF_DEVICE_RULES_H
          #include <stddef.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          #define APPSPOOF_PKG_MAX    256
          #define APPSPOOF_CODE_MAX   64
          #define APPSPOOF_DEVICE_MAX 512
          struct appspoof_device_rule {
              char pkg[APPSPOOF_PKG_MAX];
              char code[APPSPOOF_CODE_MAX];
          };
          struct appspoof_device_rules {
              struct appspoof_device_rule items[APPSPOOF_DEVICE_MAX];
              int count;
          };
          int appspoof_device_rules_load(const char *path, struct appspoof_device_rules *out);
          const struct appspoof_device_rule *
          appspoof_device_rules_find(const struct appspoof_device_rules *rules, const char *pkg);
          #ifdef __cplusplus
          }
          #endif
          #endif
          X_EOF

          cat > src/device_rules.c <<'X_EOF'
          #include "device_rules.h"
          #include <stdio.h>
          #include <string.h>
          static int copy_field(char *dst, size_t cap, const char *src) {
              size_t len = strlen(src);
              if (len >= cap) return -1;
              memcpy(dst, src, len); dst[len] = '\0';
              return 0;
          }
          int appspoof_device_rules_load(const char *path, struct appspoof_device_rules *out) {
              if (!path || !out) return -1;
              out->count = 0;
              FILE *f = fopen(path, "r");
              if (!f) return 0;
              char line[1024]; int errors = 0;
              while (fgets(line, sizeof(line), f)) {
                  size_t n = strlen(line);
                  int complete = (n > 0 && (line[n-1] == '\n' || line[n-1] == '\r')) || feof(f);
                  if (!complete) { int ch; while ((ch = fgetc(f)) != EOF && ch != '\n') {} errors++; continue; }
                  while (n > 0 && (line[n-1] == '\n' || line[n-1] == '\r')) line[--n] = '\0';
                  if (n == 0 || line[0] == '#') continue;
                  char *tab = strchr(line, '\t');
                  if (!tab) { errors++; continue; }
                  *tab = '\0';
                  char *pkg = line; char *code = tab + 1;
                  if (strchr(code, '\t')) { errors++; continue; }
                  if (pkg[0] == '\0' || code[0] == '\0') { errors++; continue; }
                  if (out->count >= APPSPOOF_DEVICE_MAX) { errors++; break; }
                  struct appspoof_device_rule *r = &out->items[out->count];
                  if (copy_field(r->pkg,  sizeof(r->pkg),  pkg)  < 0) { errors++; continue; }
                  if (copy_field(r->code, sizeof(r->code), code) < 0) { errors++; continue; }
                  out->count++;
              }
              fclose(f);
              return errors ? -errors : 0;
          }
          const struct appspoof_device_rule *
          appspoof_device_rules_find(const struct appspoof_device_rules *rules, const char *pkg) {
              if (!rules || !pkg) return 0;
              for (int i = 0; i < rules->count; ++i)
                  if (strcmp(rules->items[i].pkg, pkg) == 0) return &rules->items[i];
              return 0;
          }
          X_EOF

          cat > src/hw_rules.h <<'X_EOF'
          #ifndef APPSPOOF_HW_RULES_H
          #define APPSPOOF_HW_RULES_H
          #include <stddef.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          #define APPSPOOF_HW_PKG_MAX  256
          #define APPSPOOF_HW_KEY_MAX  64
          #define APPSPOOF_HW_MAX      512
          struct appspoof_hw_rule {
              char pkg[APPSPOOF_HW_PKG_MAX];
              char gpu[APPSPOOF_HW_KEY_MAX];
              char cpu[APPSPOOF_HW_KEY_MAX];
          };
          struct appspoof_hw_rules {
              struct appspoof_hw_rule items[APPSPOOF_HW_MAX];
              int count;
          };
          int appspoof_hw_rules_load(const char *path, struct appspoof_hw_rules *out);
          const struct appspoof_hw_rule *
          appspoof_hw_rules_find(const struct appspoof_hw_rules *rules, const char *pkg);
          #ifdef __cplusplus
          }
          #endif
          #endif
          X_EOF

          cat > src/hw_rules.c <<'X_EOF'
          #include "hw_rules.h"
          #include <stdio.h>
          #include <string.h>
          static int copy_field(char *dst, size_t cap, const char *src) {
              size_t len = strlen(src);
              if (len >= cap) return -1;
              memcpy(dst, src, len); dst[len] = '\0';
              return 0;
          }
          int appspoof_hw_rules_load(const char *path, struct appspoof_hw_rules *out) {
              if (!path || !out) return -1;
              out->count = 0;
              FILE *f = fopen(path, "r");
              if (!f) return 0;
              char line[1024]; int errors = 0;
              while (fgets(line, sizeof(line), f)) {
                  size_t n = strlen(line);
                  int complete = (n > 0 && (line[n-1] == '\n' || line[n-1] == '\r')) || feof(f);
                  if (!complete) { int ch; while ((ch = fgetc(f)) != EOF && ch != '\n') {} errors++; continue; }
                  while (n > 0 && (line[n-1] == '\n' || line[n-1] == '\r')) line[--n] = '\0';
                  if (n == 0 || line[0] == '#') continue;
                  char *t1 = strchr(line, '\t'); if (!t1) { errors++; continue; }
                  *t1 = '\0';
                  char *pkg = line; char *rest = t1 + 1;
                  char *t2 = strchr(rest, '\t'); if (!t2) { errors++; continue; }
                  *t2 = '\0';
                  char *gpu = rest; char *cpu = t2 + 1;
                  if (strchr(cpu, '\t')) { errors++; continue; }
                  if (pkg[0] == '\0') { errors++; continue; }
                  if (out->count >= APPSPOOF_HW_MAX) { errors++; break; }
                  struct appspoof_hw_rule *r = &out->items[out->count];
                  if (copy_field(r->pkg, sizeof(r->pkg), pkg) < 0) { errors++; continue; }
                  if (copy_field(r->gpu, sizeof(r->gpu), gpu) < 0) { errors++; continue; }
                  if (copy_field(r->cpu, sizeof(r->cpu), cpu) < 0) { errors++; continue; }
                  out->count++;
              }
              fclose(f);
              return errors ? -errors : 0;
          }
          const struct appspoof_hw_rule *
          appspoof_hw_rules_find(const struct appspoof_hw_rules *rules, const char *pkg) {
              if (!rules || !pkg) return 0;
              for (int i = 0; i < rules->count; ++i)
                  if (strcmp(rules->items[i].pkg, pkg) == 0) return &rules->items[i];
              return 0;
          }
          X_EOF

          cat > src/build_spoof.h <<'X_EOF'
          #ifndef APPSPOOF_BUILD_SPOOF_H
          #define APPSPOOF_BUILD_SPOOF_H
          #include <jni.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          int appspoof_build_apply(JNIEnv *env, const char *preset_code);
          #ifdef __cplusplus
          }
          #endif
          #endif
          X_EOF

          cat > src/hw_hooks.h <<'X_EOF'
          #ifndef APPSPOOF_HW_HOOKS_H
          #define APPSPOOF_HW_HOOKS_H
          #include <jni.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          int appspoof_hw_apply(JNIEnv *env, const char *gpu_key, const char *cpu_key);
          #ifdef __cplusplus
          }
          #endif
          #endif
          X_EOF

          cat > src/zygisk_compat.h <<'X_EOF'
          #ifndef APPSPOOF_ZYGISK_COMPAT_H
          #define APPSPOOF_ZYGISK_COMPAT_H
          #include <sys/types.h>
          #include <zygisk.hpp>
          #endif
          X_EOF

          echo "C sources OK"
          ls -la src/

      - name: Write source files (C++)
        run: |
          set -e

          cat > src/build_spoof.cpp <<'X_EOF'
          #include "build_spoof.h"
          #include "presets_gen.h"
          #include <string.h>

          extern "C" {

          static const struct appspoof_preset *find_preset(const char *code) {
              if (!code || !*code) return 0;
              for (int i = 0; i < appspoof_presets_count; ++i)
                  if (strcmp(appspoof_presets[i].code, code) == 0) return &appspoof_presets[i];
              return 0;
          }

          static int set_static_string(JNIEnv *env, jclass cls,
                                       const char *field, const char *value) {
              if (!value || value[0] == '\0') return 0;
              jfieldID fid = env->GetStaticFieldID(cls, field, "Ljava/lang/String;");
              if (!fid) { if (env->ExceptionCheck()) env->ExceptionClear(); return -1; }
              jstring js = env->NewStringUTF(value);
              if (!js) { if (env->ExceptionCheck()) env->ExceptionClear(); return -2; }
              env->SetStaticObjectField(cls, fid, js);
              env->DeleteLocalRef(js);
              if (env->ExceptionCheck()) { env->ExceptionClear(); return -3; }
              return 1;
          }

          int appspoof_build_apply(JNIEnv *env, const char *preset_code) {
              if (!env || !preset_code || !*preset_code) return -100;
              const struct appspoof_preset *p = find_preset(preset_code);
              if (!p) return -101;
              jclass cls = env->FindClass("android/os/Build");
              if (!cls) { if (env->ExceptionCheck()) env->ExceptionClear(); return -102; }
              int applied = 0;
              int rc;
              rc = set_static_string(env, cls, "BRAND",        p->brand);         if (rc == 1) applied++;
              rc = set_static_string(env, cls, "MANUFACTURER", p->manufacturer);  if (rc == 1) applied++;
              rc = set_static_string(env, cls, "DEVICE",       p->device);        if (rc == 1) applied++;
              rc = set_static_string(env, cls, "MODEL",        p->model);         if (rc == 1) applied++;
              rc = set_static_string(env, cls, "FINGERPRINT",  p->fingerprint);   if (rc == 1) applied++;
              rc = set_static_string(env, cls, "PRODUCT",      p->product);       if (rc == 1) applied++;
              env->DeleteLocalRef(cls);
              return applied;
          }

          } /* extern "C" */
          X_EOF

          cat > src/hw_hooks.cpp <<'X_EOF'
          #include "hw_hooks.h"
          #include "hw_values_gen.h"
          #include <string.h>
          #include <stdlib.h>
          #include <android/log.h>

          #define TAG "APPSPOOF"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, TAG, __VA_ARGS__)
          #define LOGW(...) __android_log_print(ANDROID_LOG_WARN, TAG, __VA_ARGS__)

          extern "C" {

          static const struct appspoof_gpu_value *find_gpu(const char *k) {
              if (!k || !*k) return 0;
              for (int i = 0; i < appspoof_gpu_values_count; ++i)
                  if (strcmp(appspoof_gpu_values[i].key, k) == 0) return &appspoof_gpu_values[i];
              return 0;
          }
          static const struct appspoof_cpu_value *find_cpu(const char *k) {
              if (!k || !*k) return 0;
              for (int i = 0; i < appspoof_cpu_values_count; ++i)
                  if (strcmp(appspoof_cpu_values[i].key, k) == 0) return &appspoof_cpu_values[i];
              return 0;
          }
          static int set_static_string(JNIEnv *env, jclass cls,
                                       const char *field, const char *value) {
              if (!value || !*value) return 0;
              jfieldID fid = env->GetStaticFieldID(cls, field, "Ljava/lang/String;");
              if (!fid) { if (env->ExceptionCheck()) env->ExceptionClear(); return -1; }
              jstring js = env->NewStringUTF(value);
              if (!js) { if (env->ExceptionCheck()) env->ExceptionClear(); return -2; }
              env->SetStaticObjectField(cls, fid, js);
              env->DeleteLocalRef(js);
              if (env->ExceptionCheck()) { env->ExceptionClear(); return -3; }
              return 1;
          }

          int appspoof_hw_apply(JNIEnv *env, const char *gpu_key, const char *cpu_key) {
              if (!env) return -100;
              if (!gpu_key) gpu_key = "";
              if (!cpu_key) cpu_key = "";
              int applied = 0;
              if (gpu_key[0]) {
                  const struct appspoof_gpu_value *g = find_gpu(gpu_key);
                  if (g) {
                      (void)setenv("SPOOF_GPU_RENDERER",     g->renderer,  1);
                      (void)setenv("SPOOF_GPU_VENDOR",       g->vendor,    1);
                      (void)setenv("SPOOF_VULKAN_DEVICE",    g->vk_device, 1);
                      (void)setenv("SPOOF_VULKAN_VENDOR_ID", g->vk_vendor, 1);
                      LOGI("[HW] GPU env key=%s renderer=%s", gpu_key, g->renderer);
                      applied++;
                  } else {
                      LOGW("[HW] GPU key tidak dikenal: %s", gpu_key);
                  }
              }
              if (cpu_key[0]) {
                  const struct appspoof_cpu_value *c = find_cpu(cpu_key);
                  if (c) {
                      jclass cls = env->FindClass("android/os/Build");
                      if (cls) {
                          if (set_static_string(env, cls, "HARDWARE",         c->hardware)  == 1) applied++;
                          if (set_static_string(env, cls, "BOARD",            c->board)     == 1) applied++;
                          if (set_static_string(env, cls, "SOC_MODEL",        c->soc_model) == 1) applied++;
                          if (set_static_string(env, cls, "SOC_MANUFACTURER", c->soc_mfr)   == 1) applied++;
                          env->DeleteLocalRef(cls);
                          LOGI("[HW] CPU key=%s model=%s mfr=%s", cpu_key, c->soc_model, c->soc_mfr);
                      } else {
                          if (env->ExceptionCheck()) env->ExceptionClear();
                      }
                  } else {
                      LOGW("[HW] CPU key tidak dikenal: %s", cpu_key);
                  }
              }
              return applied;
          }

          } /* extern "C" */
          X_EOF

          cat > src/zygisk_module.cpp <<'X_EOF'
          #include "zygisk_compat.h"
          #include <jni.h>
          #include <unistd.h>
          #include <string.h>
          #include <android/log.h>

          #include "build_spoof.h"
          #include "hw_hooks.h"

          #define APPSPOOF_TAG "APPSPOOF"
          #define L(level, stage, ...) \
              __android_log_print(level, APPSPOOF_TAG, "[" stage "] " __VA_ARGS__)

          static int  g_has_device = 0;
          static char g_device_code[64];
          static int  g_has_hw = 0;
          static char g_hw_gpu[64];
          static char g_hw_cpu[64];

          class AppSpoofModule : public zygisk::ModuleBase {
          public:
              void onLoad(zygisk::Api *api_, JNIEnv *env_) override {
                  this->api = api_; this->env = env_;
                  L(ANDROID_LOG_INFO, "BOOT", "onLoad zygisk API=%d", ZYGISK_API_VERSION);
              }
              void preAppSpecialize(zygisk::AppSpecializeArgs *args) override {
                  g_has_device = 0; g_has_hw = 0;
                  g_device_code[0] = '\0'; g_hw_gpu[0] = '\0'; g_hw_cpu[0] = '\0';
                  if (!args || !args->nice_name) { skip(); return; }
                  const char *nice = env->GetStringUTFChars(args->nice_name, nullptr);
                  if (!nice) { if (env->ExceptionCheck()) env->ExceptionClear(); skip(); return; }
                  char pkg[256];
                  strncpy(pkg, nice, sizeof(pkg) - 1); pkg[sizeof(pkg) - 1] = '\0';
                  env->ReleaseStringUTFChars(args->nice_name, nice);
                  char *colon = strchr(pkg, ':'); if (colon) *colon = '\0';
                  if (pkg[0] == '\0') { skip(); return; }
                  L(ANDROID_LOG_INFO, "PRE", "pkg=%s", pkg);

                  /* KONFIG HARDCODE untuk test: com.finalwire.aida64 -> RM11P */
                  if (strcmp(pkg, "com.finalwire.aida64") == 0) {
                      g_has_device = 1;
                      strncpy(g_device_code, "RM11P", sizeof(g_device_code) - 1);
                      L(ANDROID_LOG_INFO, "PRE", "HARDCODED TARGET pkg=%s code=RM11P", pkg);
                  } else {
                      L(ANDROID_LOG_INFO, "PRE", "pkg=%s bukan target", pkg);
                      skip();
                      return;
                  }
              }
              void postAppSpecialize(const zygisk::AppSpecializeArgs *args) override {
                  (void)args;
                  if (g_has_device) {
                      int rc = appspoof_build_apply(env, g_device_code);
                      if (rc > 0) L(ANDROID_LOG_INFO, "POST-DEV", "code=%s fields=%d SUCCESS", g_device_code, rc);
                      else        L(ANDROID_LOG_ERROR, "POST-DEV", "code=%s rc=%d FAIL", g_device_code, rc);
                  }
                  if (g_has_hw) {
                      int rc = appspoof_hw_apply(env, g_hw_gpu, g_hw_cpu);
                      if (rc >= 0) L(ANDROID_LOG_INFO, "POST-HW", "gpu=%s cpu=%s fields=%d SUCCESS",
                                     g_hw_gpu, g_hw_cpu, rc);
                      else         L(ANDROID_LOG_ERROR, "POST-HW", "gpu=%s cpu=%s rc=%d FAIL",
                                     g_hw_gpu, g_hw_cpu, rc);
                  }
              }
          private:
              zygisk::Api *api = nullptr;
              JNIEnv *env = nullptr;
              void skip() { if (api) api->setOption(zygisk::Option::DLCLOSE_MODULE_LIBRARY); }
          };

          REGISTER_ZYGISK_MODULE(AppSpoofModule)
          X_EOF

          echo "C++ sources OK (companion removed)"
          ls -la src/

      - name: Write Python extractors
        run: |
          set -e
          cat > tools_extract_presets.py <<'X_EOF'
          #!/usr/bin/env python3
          import re, pathlib, xml.etree.ElementTree as ET

          JAVA = pathlib.Path("docs/ref/PerAppsPropsUtils.java")
          ARR  = pathlib.Path("docs/ref/custom_arrays.xml")
          OUT  = pathlib.Path("src/presets.tsv")

          FUNC_RE = re.compile(r'private\s+static\s+Map(?:<[^>]*>)?\s+create(\w+?)Props\s*\(\s*\)\s*\{')
          PUT_RE  = re.compile(r'props\.put\(\s*"([A-Z]+)"\s*,\s*"((?:[^"\\]|\\.)*)"\s*\)\s*;')

          def unescape(s):
              out, i = [], 0
              while i < len(s):
                  if s[i] == '\\' and i + 1 < len(s):
                      n = s[i+1]
                      if n == 'n': out.append('\n'); i += 2; continue
                      if n == 't': out.append('\t'); i += 2; continue
                      if n == '"': out.append('"');  i += 2; continue
                      if n == '\\': out.append('\\'); i += 2; continue
                  out.append(s[i]); i += 1
              return ''.join(out)

          def match_brace(text, start):
              depth = 1; j = start
              while j < len(text) and depth > 0:
                  c = text[j]
                  if c == '{': depth += 1
                  elif c == '}': depth -= 1
                  j += 1
              return text[start:j-1]

          def parse_java():
              t = JAVA.read_text(encoding="utf-8")
              presets = {}
              for m in FUNC_RE.finditer(t):
                  code = m.group(1); body = match_brace(t, m.end())
                  props = {}
                  for pm in PUT_RE.finditer(body): props[pm.group(1)] = unescape(pm.group(2))
                  presets[code] = props
              return presets

          def parse_labels():
              text = ARR.read_text(encoding="utf-8", errors="replace")
              try: root = ET.fromstring(text)
              except ET.ParseError: root = ET.fromstring(f"<root>{text}</root>")
              vals = lbls = None
              for el in root.iter():
                  tag = el.tag.split('}')[-1]
                  if tag != "string-array": continue
                  name = el.get("name")
                  items = [(it.text or "").strip() for it in el if it.tag.split('}')[-1] == "item"]
                  if name == "perapp_spoof_profile_values": vals = items
                  if name == "perapp_spoof_profile_labels": lbls = items
              if not vals or not lbls or len(vals) != len(lbls):
                  raise SystemExit("labels mismatch")
              return dict(zip(vals, lbls))

          presets = parse_java(); labels = parse_labels()
          order = [c for c in labels.keys() if c != "None" and c in presets]
          OUT.parent.mkdir(parents=True, exist_ok=True)
          with OUT.open("w", encoding="utf-8") as f:
              f.write("code\tlabel\tbrand\tmanufacturer\tdevice\tmodel\tfingerprint\tproduct\tsource\n")
              for code in order:
                  p = presets[code]
                  row = [code, labels[code],
                         p.get("BRAND",""), p.get("MANUFACTURER",""),
                         p.get("DEVICE",""), p.get("MODEL",""),
                         p.get("FINGERPRINT",""), p.get("PRODUCT",""),
                         "docs/ref/PerAppsPropsUtils.java"]
                  for v in row:
                      if "\t" in v or "\n" in v: raise SystemExit(f"tab in {code}")
                  f.write("\t".join(row) + "\n")
          print(f"presets.tsv: {len(order)} entries")
          X_EOF

          cat > tools_extract_hw.py <<'X_EOF'
          #!/usr/bin/env python3
          import re, pathlib

          JAVA = pathlib.Path("docs/ref/AdvancedAppSpoofUtils.java")
          GPU_OUT = pathlib.Path("src/hw_gpu.tsv")
          CPU_OUT = pathlib.Path("src/hw_cpu.tsv")
          TPL = pathlib.Path("src/hw_templates"); TPL.mkdir(parents=True, exist_ok=True)

          def unescape(s):
              out, i = [], 0
              while i < len(s):
                  if s[i] == '\\' and i + 1 < len(s):
                      n = s[i+1]
                      if n == 'n': out.append('\n'); i += 2; continue
                      if n == 't': out.append('\t'); i += 2; continue
                      if n == 'r': out.append('\r'); i += 2; continue
                      if n == '"': out.append('"');  i += 2; continue
                      if n == '\\': out.append('\\'); i += 2; continue
                  out.append(s[i]); i += 1
              return ''.join(out)

          def read_str(text, start):
              i = start
              while i < len(text) and text[i] != '"': i += 1
              if i >= len(text): return ('', start)
              i += 1
              buf = []
              while i < len(text):
                  c = text[i]
                  if c == '\\':
                      if i + 1 < len(text): buf.append(text[i:i+2]); i += 2; continue
                      i += 1; continue
                  if c == '"':
                      res = unescape(''.join(buf)); buf = []
                      i += 1
                      j = i
                      while j < len(text) and text[j] in ' \t\r\n': j += 1
                      if j < len(text) and text[j] == '+':
                          j += 1
                          while j < len(text) and text[j] in ' \t\r\n': j += 1
                          if j < len(text) and text[j] == '"':
                              i = j + 1; continue
                      return (res, i)
                  buf.append(c); i += 1
              return ('', i)

          text = JAVA.read_text(encoding="utf-8")

          def read_fields(start, nfields):
              i = start; fields = []
              while i < len(text) and len(fields) < nfields:
                  while i < len(text) and text[i] in ' \t\r\n,': i += 1
                  if i >= len(text): break
                  if text[i] == '}': break
                  if text[i] == '"':
                      s, i = read_str(text, i); fields.append(s)
                  else: break
              return fields

          gpu = []
          for m in re.finditer(r'GPU_PRESETS\.put\(\s*"([^"]+)"\s*,\s*new\s+String\[\]\s*\{', text):
              k = m.group(1); f = read_fields(m.end(), 4)
              if len(f) == 4: gpu.append([k] + f)

          cpu = []
          for m in re.finditer(r'CPU_PRESETS\.put\(\s*"([^"]+)"\s*,\s*new\s+String\[\]\s*\{', text):
              k = m.group(1); f = read_fields(m.end(), 5)
              if len(f) == 5: cpu.append([k] + f)

          with GPU_OUT.open("w", encoding="utf-8") as f:
              f.write("key\trenderer\tvendor\tvk_device\tvk_vendor\tsource\n")
              for k, r, v, vkd, vkv in gpu:
                  f.write("\t".join([k, r, v, vkd, vkv, "docs/ref/AdvancedAppSpoofUtils.java"]) + "\n")

          with CPU_OUT.open("w", encoding="utf-8") as f:
              f.write("key\thardware\tsoc_model\tsoc_mfr\tboard\ttemplate_file\tsource\n")
              for row in cpu:
                  k, hw, soc, mfr, board, tpl = row
                  tpl_path = TPL / (k + ".cpuinfo")
                  tpl_path.write_text(tpl, encoding="utf-8")
                  f.write("\t".join([k, hw, soc, mfr, board,
                                     f"src/hw_templates/{k}.cpuinfo",
                                     "docs/ref/AdvancedAppSpoofUtils.java"]) + "\n")

          print(f"hw_gpu.tsv={len(gpu)}  hw_cpu.tsv={len(cpu)}")
          X_EOF

          cat > tools_gen_headers.py <<'X_EOF'
          #!/usr/bin/env python3
          import pathlib

          def esc(s): return s.replace("\\","\\\\").replace('"','\\"')

          def read_tsv(p, ncol):
              rows = []
              for ln in p.read_text(encoding="utf-8").splitlines():
                  if not ln or ln.startswith("#"): continue
                  parts = ln.split("\t")
                  if parts[0] == "key": continue
                  if len(parts) != ncol: continue
                  rows.append(parts)
              return rows

          prows = read_tsv(pathlib.Path("src/presets.tsv"), 9)
          hrows = read_tsv(pathlib.Path("src/hw_models.tsv"), 4)
          grows = read_tsv(pathlib.Path("src/hw_gpu.tsv"), 6)
          crows = read_tsv(pathlib.Path("src/hw_cpu.tsv"), 7)

          with open("src/presets_gen.h", "w") as f:
              f.write("#pragma once\nstruct appspoof_preset { const char *code,*label,*brand,*manufacturer,*device,*model,*fingerprint,*product; };\n")
              f.write(f"static const struct appspoof_preset appspoof_presets[{max(len(prows),1)}] = {{\n")
              for r in prows:
                  f.write('  { ' + ','.join(f'"{esc(x)}"' for x in r[:8]) + ' },\n')
              if not prows: f.write('  { "","","","","","","","" },\n')
              f.write("};\n")
              f.write(f"static const int appspoof_presets_count = {len(prows)};\n")

          with open("src/hw_models_gen.h", "w") as f:
              f.write("#pragma once\nstruct appspoof_hw_model { const char *key; const char *label; };\n")
              g = [r for r in hrows if r[0]=="gpu"]; c = [r for r in hrows if r[0]=="cpu"]
              f.write(f"static const struct appspoof_hw_model appspoof_gpu_models[{max(len(g),1)}] = {{\n")
              for r in g: f.write(f'  {{ "{esc(r[1])}", "{esc(r[2])}" }},\n')
              if not g: f.write('  { "","" },\n')
              f.write("};\n")
              f.write(f"static const int appspoof_gpu_models_count = {len(g)};\n")
              f.write(f"static const struct appspoof_hw_model appspoof_cpu_models[{max(len(c),1)}] = {{\n")
              for r in c: f.write(f'  {{ "{esc(r[1])}", "{esc(r[2])}" }},\n')
              if not c: f.write('  { "","" },\n')
              f.write("};\n")
              f.write(f"static const int appspoof_cpu_models_count = {len(c)};\n")

          with open("src/hw_values_gen.h", "w") as f:
              f.write("#pragma once\nstruct appspoof_gpu_value { const char *key,*renderer,*vendor,*vk_device,*vk_vendor; };\n")
              f.write(f"static const struct appspoof_gpu_value appspoof_gpu_values[{max(len(grows),1)}] = {{\n")
              for r in grows: f.write('  { ' + ','.join(f'"{esc(x)}"' for x in r[:5]) + ' },\n')
              if not grows: f.write('  { "","","","","" },\n')
              f.write("};\n")
              f.write(f"static const int appspoof_gpu_values_count = {len(grows)};\n")
              f.write("struct appspoof_cpu_value { const char *key,*hardware,*soc_model,*soc_mfr,*board; };\n")
              f.write(f"static const struct appspoof_cpu_value appspoof_cpu_values[{max(len(crows),1)}] = {{\n")
              for r in crows: f.write('  { ' + ','.join(f'"{esc(x)}"' for x in r[:5]) + ' },\n')
              if not crows: f.write('  { "","","","","" },\n')
              f.write("};\n")
              f.write(f"static const int appspoof_cpu_values_count = {len(crows)};\n")

          print(f"presets={len(prows)} hw_models={len(hrows)} hw_gpu={len(grows)} hw_cpu={len(crows)}")
          X_EOF

          cat > tools_gen_webroot.py <<'X_EOF'
          #!/usr/bin/env python3
          import pathlib, json
          prows = []
          for ln in pathlib.Path("src/presets.tsv").read_text(encoding="utf-8").splitlines()[1:]:
              if not ln: continue
              c, label, brand, mfg, device, model, fp, prod, _ = ln.split("\t")
              prows.append((c, {"label": label, "brand": brand, "manufacturer": mfg,
                                "device": device, "model": model,
                                "fingerprint": fp, "product": prod}))
          grows = {}; crows = {}
          for ln in pathlib.Path("src/hw_gpu.tsv").read_text(encoding="utf-8").splitlines()[1:]:
              if not ln: continue
              k, rnd, *_ = ln.split("\t"); grows[k] = rnd
          for ln in pathlib.Path("src/hw_cpu.tsv").read_text(encoding="utf-8").splitlines()[1:]:
              if not ln: continue
              k, hw, soc, mfr, *_ = ln.split("\t"); crows[k] = f"{soc} ({mfr})"
          out = [
              "// AUTO-GENERATED",
              "window.APPSPOOF_PRESETS = " + json.dumps(dict(prows), ensure_ascii=False, indent=2) + ";",
              "window.APPSPOOF_GPU = " + json.dumps(grows, ensure_ascii=False, indent=2) + ";",
              "window.APPSPOOF_CPU = " + json.dumps(crows, ensure_ascii=False, indent=2) + ";",
              "",
          ]
          pathlib.Path("module/webroot/presets.js").write_text("\n".join(out), encoding="utf-8")
          print("presets.js OK")
          X_EOF

          python3 tools_extract_presets.py
          python3 tools_extract_hw.py

          python3 - <<'PY'
          import pathlib
          out = pathlib.Path("src/hw_models.tsv")
          lines = ["kind\tkey\tlabel\tsource"]
          for ln in pathlib.Path("src/hw_gpu.tsv").read_text(encoding="utf-8").splitlines()[1:]:
              if not ln: continue
              k, rnd, *_ = ln.split("\t")
              lines.append(f"gpu\t{k}\t{rnd}\tsrc/hw_gpu.tsv")
          for ln in pathlib.Path("src/hw_cpu.tsv").read_text(encoding="utf-8").splitlines()[1:]:
              if not ln: continue
              k, hw, soc, mfr, board, tpl, _src = ln.split("\t")
              lines.append(f"cpu\t{k}\t{soc} ({mfr})\tsrc/hw_cpu.tsv")
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"hw_models.tsv: {len(lines)-1}")
          PY

          python3 tools_gen_headers.py
          python3 tools_gen_webroot.py

      - name: Compile with Android NDK
        run: |
          set -e
          NDK="${ANDROID_NDK_HOME}"
          TCBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TCBIN/aarch64-linux-android24-clang"
          CXX="$TCBIN/aarch64-linux-android24-clang++"
          STRIP="$TCBIN/llvm-strip"
          [ -x "$CC" ]  || { echo "FAIL: $CC tidak ada"; ls "$TCBIN" | head; exit 1; }
          [ -x "$CXX" ] || { echo "FAIL: $CXX tidak ada"; exit 1; }
          [ -x "$STRIP" ] || { echo "FAIL: $STRIP tidak ada"; exit 1; }

          INC_MOD="-Isrc -Isrc/third_party"
          EXTRA="-include sys/types.h"

          mkdir -p build/mod

          echo "== compile module .c =="
          for f in device_rules hw_rules; do
            "$CC" -std=c11 -O2 -fPIC -fvisibility=hidden -Wno-everything $EXTRA $INC_MOD -c "src/$f.c" -o "build/mod/$f.o"
          done

          echo "== compile module .cpp (pakai libc++_shared via NEEDED) =="
          for f in build_spoof hw_hooks zygisk_module; do
            "$CXX" -std=c++17 -O2 -fPIC -fvisibility=hidden \
              -fno-exceptions -fno-rtti \
              -Wno-everything $EXTRA $INC_MOD -c "src/$f.cpp" -o "build/mod/$f.o"
          done

          echo "== link (dengan libc++_shared di NEEDED — supaya tidak bootloop) =="
          "$CXX" -shared -Wl,--gc-sections -Wl,--exclude-libs,ALL \
            -Wl,--no-as-needed \
            -o build/libzygisk.so build/mod/*.o

          echo "--- pre-strip readelf ---"
          readelf -d build/libzygisk.so | grep -E 'NEEDED|RPATH|RUNPATH' || true

          echo "== sanity: entry point ada =="
          nm -D build/libzygisk.so | grep -E 'zygisk_module_entry' || { echo "FAIL: entry hilang"; exit 1; }

          echo "== strip =="
          cp build/libzygisk.so build/libzygisk.so.bak
          "$STRIP" --strip-all build/libzygisk.so
          ls -la build/libzygisk.so.bak build/libzygisk.so

          echo "--- post-strip readelf ---"
          readelf -d build/libzygisk.so | grep -E 'NEEDED|RPATH|RUNPATH' || true
          echo "--- post-strip symbols ---"
          nm -D build/libzygisk.so | grep -E 'zygisk_module_entry'

      - name: Write module files
        run: |
          set -e
          cat > module/module.prop <<'X_EOF'
          id=appspoof_zygisk
          name=AppSpoof
          version=v1.0.0-minimal
          versionCode=1
          author=APPSPOOF
          description=Minimal Zygisk module — test preload only. Config hardcoded.
          X_EOF

          cat > module/customize.sh <<'X_EOF'
          #!/system/bin/sh
          SKIPUNZIP=0
          ui_print "- APPSPOOF minimal: customize"
          set_perm_recursive "$MODPATH" 0 0 0755 0644
          [ -d "$MODPATH/zygisk" ] && set_perm_recursive "$MODPATH/zygisk" 0 0 0755 0644
          ui_print "- APPSPOOF minimal: done"
          X_EOF

          cat > module/uninstall.sh <<'X_EOF'
          #!/system/bin/sh
          set -u
          exit 0
          X_EOF

          chmod +x module/customize.sh module/uninstall.sh

      - name: Package module zip
        run: |
          set -e
          STAGE=build/stage
          rm -rf "$STAGE"; mkdir -p "$STAGE/zygisk"
          cp module/module.prop  "$STAGE/"
          cp module/customize.sh "$STAGE/"
          cp module/uninstall.sh "$STAGE/"
          cp build/libzygisk.so "$STAGE/zygisk/arm64-v8a.so"
          chmod 0755 "$STAGE/customize.sh" "$STAGE/uninstall.sh"
          chmod 0644 "$STAGE/zygisk/arm64-v8a.so"
          echo "=== struktur ==="
          find "$STAGE" -type f | sort
          echo ""
          echo "=== .so info ==="
          readelf -d "$STAGE/zygisk/arm64-v8a.so" | grep -E 'NEEDED|RPATH|RUNPATH' || true
          nm -D "$STAGE/zygisk/arm64-v8a.so" | grep -E 'zygisk_module_entry'
          echo ""
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          ZIP="appspoof-minimal-$STAMP.zip"
          ( cd "$STAGE" && zip -r -q "../../$ZIP" . -x '.*' )
          ls -la "$ZIP"
          sha256sum "$ZIP"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appspoof-minimal
          path: appspoof-minimal-*.zip
          if-no-files-found: error
